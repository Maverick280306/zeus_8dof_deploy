# Drive gains, one set per joint, in the J_* order of NexusState.msg.
#
#   zeus gains show                              what is here, and what the board took
#   zeus gains push                              send these to the board
#   zeus gains set left_knee_pitch --vel 1.0     change one and send it
#
# These reach the ODrives through the STM32 (it is the only thing on the CAN
# bus) and only while the robot is standing down. The board re-sends them on
# every arm, so a drive that reboots comes back with them - but it does NOT
# save them. Power-cycle the board and it goes back to the table in
# Appli/App/robot_config.c. When a value is settled, put it there too.
#
# Units are the ODrive's own:
#   pos       (turn/s) per turn of error
#   vel       Nm per (turn/s) of error
#   vel_int   Nm per turn of accumulated error
#
# A NEGATIVE value means "leave that drive's own saved value alone", which is
# how a joint is taken out of the loop while its neighbour is being tuned.
#
# These are the gains the policy TRAINED on (below), converted per drive. They
# replaced the bench leg's numbers (30 / 10 / 50 on hips and knees, 17 / 0.3 /
# 1.5 measured on a 9:1 ankle), which were 6-15x stiffer than anything the
# policy saw. Still untuned on the robot itself: tune FROM here, on recordings.
#
# What the policy DID train on, converted to the ODrive's own units. The drive's
# position and velocity are turns of whatever shaft ITS encoder sits on, while
# its torque is always MOTOR torque, so:
#
#     pos_gain = KP / KD          always - a ratio of encoder units, gear cancels
#     vel_gain = KD * 2pi / N     encoder on the load
#     vel_gain = KD * 2pi / N^2   encoder on the MOTOR  (the ankle)
#
#     class                    KP     KD   gear   pos_gain   vel_gain
#     hip pitch, knee         150   12.0   47:1       12.5     1.6042
#     hip roll                 60    4.0   26:1       15.0     0.9666
#     ankle pitch              30    1.2   15:1       25.0     0.0335
#
# vel_int is 0 in training - there was no integrator at all, so the 50.0 below
# is not a smaller version of it, it is a term that did not exist.
#
# TYPED IN 2026-11-22, once the encoders were settled: every drive reads the
# load side EXCEPT the two ankles, which use their commutation encoders through
# the 15:1 box - so both take N^2 = 225 (vel 0.033510). (The right ankle was on
# a load-side encoder, N = 15 and vel 0.50265, until later that day.) Same values as g_drive_gains in
# stm32_zeuss/Appli/App/robot_config.c, which is what the board arms with.
#
# Known risk: no integrator means friction leaves a steady error of
# friction / KP (~2 deg per Nm on an ankle). If the rolls or ankles stick in
# the first air run, give THOSE a small vel_int rather than stiffening all.

joints:
  left_hip_pitch:    {pos: 12.5, vel: 1.60420,  vel_int: 0.0}
  left_hip_roll:     {pos: 15.0, vel: 0.96664,  vel_int: 0.0}
  left_knee_pitch:   {pos: 12.5, vel: 1.60420,  vel_int: 0.0}
  left_ankle_pitch:  {pos: 25.0, vel: 0.033510, vel_int: 0.0}
  right_hip_pitch:   {pos: 12.5, vel: 1.60420,  vel_int: 0.0}
  right_hip_roll:    {pos: 15.0, vel: 0.96664,  vel_int: 0.0}
  right_knee_pitch:  {pos: 12.5, vel: 1.60420,  vel_int: 0.0}
  right_ankle_pitch: {pos: 25.0, vel: 0.033510, vel_int: 0.0}
